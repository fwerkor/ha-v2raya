name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - run: python tests/validate.py
      - run: python tests/test_host_proxy.py
      - run: sh -n v2raya/run.sh scripts/install-local-cn.sh scripts/check-host-proxy.sh

  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./v2raya
          push: false
          platforms: ${{ matrix.platform }}
          build-args: BUILD_VERSION=0.2.0
          tags: ha-v2raya:test

  smoke:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg TARGETARCH=amd64 -t ha-v2raya:smoke ./v2raya
      - run: |
          set -eu
          test "$(docker run --rm --entrypoint /usr/bin/v2raya ha-v2raya:smoke --version)" = '2.4.0'
          docker run --rm --entrypoint /usr/bin/v2raya_core ha-v2raya:smoke version | grep -F 'V2RAYA_CORE 2.4.0'
          docker run -d --name ha-v2raya-test -p 127.0.0.1:12017:2017 ha-v2raya:smoke
          for i in $(seq 1 45); do
            if curl -fsS -o /dev/null http://127.0.0.1:12017/; then exit 0; fi
            sleep 2
          done
          docker logs ha-v2raya-test
          exit 1
      - if: always()
        run: docker rm -f ha-v2raya-test || true

  publish:
    # Keep released image tags immutable; invoke publication only for a new version.
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/v2raya-2.4.0')
    needs: [validate, build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture versioned image
        uses: docker/build-push-action@v6
        with:
          context: ./v2raya
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: BUILD_VERSION=0.2.0
          tags: ghcr.io/fwerkor/ha-v2raya:0.2.0
