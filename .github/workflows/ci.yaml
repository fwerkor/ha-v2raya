name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - run: python tests/validate.py
      - run: sh -n v2raya/run.sh
  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            ha_arch: amd64
          - platform: linux/arm64
            ha_arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./v2raya
          push: false
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_VERSION=0.1.0
            BUILD_ARCH=${{ matrix.ha_arch }}
          tags: ha-v2raya:test
  smoke:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ha-v2raya:smoke ./v2raya
      - run: |
          set -eu
          docker run -d --name ha-v2raya-test -p 127.0.0.1:12017:2017 ha-v2raya:smoke
          for i in $(seq 1 45); do
            if curl -fsS -o /dev/null http://127.0.0.1:12017/; then exit 0; fi
            sleep 2
          done
          docker logs ha-v2raya-test
          exit 1
      - if: always()
        run: docker rm -f ha-v2raya-test || true
